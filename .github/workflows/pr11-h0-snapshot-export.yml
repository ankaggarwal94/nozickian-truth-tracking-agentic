name: pr11-h0-snapshot-export

on:
  push:
    branches:
      - automation/pr11-h0-snapshot-export-5b0ea76
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact reviewed PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 5b0ea76c0f827d5b4ebf5344b28f9173869a137e
          fetch-depth: 1
      - name: Build an immutable source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5b0ea76c0f827d5b4ebf5344b28f9173869a137e"
          mkdir -p snapshot
          git archive --format=tar --output=snapshot/pr11-h0.tar HEAD
          sha256sum snapshot/pr11-h0.tar > snapshot/pr11-h0.tar.sha256
      - name: Upload the source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr11-h0-source
          path: snapshot/
          compression-level: 0
          retention-days: 1
